name: scout
basePrompt: custom
whenToUse: "Facts inside a location: where something is, how it works, which files touch X; list or summarize files; a library's API as that code uses it. Answers with path:line."
notFor: Changing anything; outside facts not tied to this code.
kind: worker
dispatchable: true
skills:
  - scout
  - docs-seeker
preloadSkills: []
limits:
  maxTurns: 40
subagents:
  parallel: 3
  depth: 1
sideEffects: none
capabilities:
  - read
  - web
  - shell
  - skills
mcpTools:
  - MemorySearch
  - MemoryGet
  - MemoryExpand
noSubagents: true
permissionMode: auto
budgetUsd: 1.5
model: haiku
