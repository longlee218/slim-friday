kind: worker
dispatchable: true
noSubagents: true
permissionMode: auto
limits:
  maxTurns: 60
subagents:
  parallel: 3
  depth: 1
budgetUsd: 4
mcpTools:
  - MemorySearch
  - MemoryGet
  - MemoryExpand
name: humanizer-writer
basePrompt: custom
whenToUse: "Prose for people: docs, README, release notes, posts, emails; writes or edits documents in a natural voice from the facts in the brief and earlier results."
notFor: Code.
sideEffects: location
capabilities:
  - read
  - write
  - skills
skills:
  - using-skills
  - verification-before-completion
  - technical-writing
  - reviewing-technical-prose
  - writing-changelogs
  - recording-decisions
preloadSkills:
  - using-skills
requiredSkills:
  - technical-writing
  - verification-before-completion
model: sonnet
