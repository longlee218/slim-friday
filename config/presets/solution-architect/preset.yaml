kind: worker
dispatchable: true
noSubagents: true
permissionMode: auto
limits:
  maxTurns: 60
subagents:
  parallel: 3
  depth: 1
budgetUsd: 4
mcpTools:
  - MemorySearch
  - MemoryGet
  - MemoryExpand
name: solution-architect
basePrompt: custom
whenToUse: "Design before building: compare approaches and choose one; define components, interfaces, data and risks of a feature or system. Reads code and docs, writes no files."
notFor: Fact lookups; screen and UI design.
sideEffects: none
capabilities:
  - read
  - web
  - skills
skills:
  - using-skills
  - architecture-designer
  - docs-seeker
preloadSkills:
  - using-skills
requiredSkills:
  - architecture-designer
model: sonnet
