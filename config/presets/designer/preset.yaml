kind: worker
dispatchable: true
noSubagents: true
permissionMode: auto
limits:
  maxTurns: 60
subagents:
  parallel: 3
  depth: 1
budgetUsd: 4
mcpTools:
  - MemorySearch
  - MemoryGet
  - MemoryExpand
  - browser_navigate
  - browser_navigate_back
  - browser_tabs
  - browser_close
  - browser_resize
  - browser_wait_for
  - browser_snapshot
  - browser_take_screenshot
  - browser_find
  - browser_click
  - browser_hover
  - browser_drag
  - browser_drop
  - browser_type
  - browser_press_key
  - browser_fill_form
  - browser_select_option
  - browser_file_upload
  - browser_handle_dialog
  - browser_emulate_media
  - browser_evaluate
  - browser_run_code_unsafe
  - browser_console_messages
  - browser_network_requests
  - browser_network_request
name: designer
whenToUse: "Design of a user interface or experience: screens, layout, components, copy, states and accessibility; writes design notes or static mockups in the location and runs design tools (sandboxed shell)."
notFor: Production code.
sideEffects: location
capabilities:
  - read
  - write
  - shell
  - web
  - skills
skills:
  - using-skills
  - verification-before-completion
  - docs-seeker
  - ui-ux-pro-max
  - wcag-audit-patterns
  - impeccable
preloadSkills:
  - using-skills
requiredSkills:
  - ui-ux-pro-max
  - impeccable
binaries:
  - impeccable-engine
model: opus
vars:
  commitPrefixes: "docs:, style:, chore:"
