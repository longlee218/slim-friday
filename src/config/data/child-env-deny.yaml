# Variables of the BOT that the agent's own process (the SDK child and its shell) must NOT inherit.
# Everything else in the owner's env passes through (PATH, HOME, SSH_AUTH_SOCK, GH_*, git vars, proxies, locale ...).
# The app sets the provider credentials, subagent limits, compaction and cache TTL vars itself (runtime/sdk-env.ts).
# A new key of the env schema in config/agent-config.ts must be listed here (exact/prefixes) or in `passthrough`:
# test/child-env-deny.test.ts fails otherwise.

# Exact names.
exact:
  # agent-config.ts env schema
  - CLAUDE_CODE_OAUTH_TOKEN
  - OPENROUTER_API_KEY
  - JEV_API_KEY
  - LLM_PROVIDER
  - AGENT_HOME
  - LOG_LEVEL
  - DISCORD_TOKEN
  - OWNER_DISCORD_ID
  - DISCORD_GUILD_ID
  - MODEL
  - MEMORY_MODEL
  - GIT_AUTHOR # the app var (git's own GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL are not matched)
  - MAX_TURNS
  - MAX_BUDGET_USD
  - TIMEOUT_MS
  - MAX_CONCURRENT_RUNS
  # other app secrets
  - GITHUB_PERSONAL_ACCESS_TOKEN
  # set per role by the app, never inherited
  - CLAUDE_CODE_AUTO_COMPACT_WINDOW
  - CLAUDE_AUTOCOMPACT_PCT_OVERRIDE
  - CLAUDE_CODE_PROMPT_CACHE_TTL
  - CLAUDE_CODE_SUBAGENT_PROMPT_CACHE_TTL

# Prefixes.
prefixes:
  - MODEL_ # MODEL_HAIKU|SONNET|OPUS, MODEL_<ROLE> (role-env.ts)
  - BUDGET_ # BUDGET_<ROLE>_USD (role-env.ts)
  - COMPACT_WINDOW_ # COMPACT_WINDOW_<ROLE> (role-env.ts)
  - FRIDAY_
  - ANTHROPIC_ # provider vars are set again by the app for the child

# Schema keys that are on purpose NOT denied (the agent may see them). None today.
passthrough: []

# Extra denies for a dispatched WORKER's process: its Bash tool inherits the SDK child's env, and a worker runs repo code. The
# app's own provider credentials are added AFTER this filter (runtime/sdk-env.ts) and the SDK strips them from the tools' env
# (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1, set for workers). git / gh auth never reaches a worker: the effect tools use it in their own
# subprocess (approval/git-run.ts).
worker:
  exact:
    - GH_TOKEN
    - GITHUB_TOKEN
    - SSH_AUTH_SOCK
    - SSH_AGENT_PID
    - PASSWORD
  prefixes:
    - GH_
    - GITHUB_
    - AWS_
    - OPENROUTER_
    - ANTHROPIC_
    - DISCORD_
    - JEV_
    - AZURE_
    - GOOGLE_
    - GCP_
    - GIT_ # git's own switches (GIT_EXTERNAL_DIFF, GIT_SSH_COMMAND, GIT_DIR ...), except the identity names kept below
  # Any variable whose name has a secret-looking word between `_`: API_KEY, MY_TOKEN, DB_PASSWORD, X_SECRET.
  pattern: "PASSWORD|PASSWD|SECRET|TOKEN|APIKEY|(^|_)(KEY|PWD|CREDENTIALS?|DSN|DATABASE_URL|CONNECTION_STRING)($|_)"
  keep:
    - PWD # the shell's own current dir, not a password
    - GIT_AUTHOR_NAME
    - GIT_AUTHOR_EMAIL
    - GIT_COMMITTER_NAME
    - GIT_COMMITTER_EMAIL
