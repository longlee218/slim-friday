# Native binaries a role's shell may run, pinned by sha256. Each version was reviewed once (download from the
# publisher's release, sidecar .sha256 and GitHub asset digest matched, `file`, `codesign -dv`, only `--version` run).
# A version bump = a new review + a new hash here. The files are NOT in git (size): install steps in
# docs/discord-setup.md. A missing or mismatching file is never offered to a run (its env var is not set).
binaries:
  impeccable-engine:
    # Engine of the impeccable skill (pbakaus/impeccable); must equal the skill's scripts/VERSION.
    version: 0.1.16
    # Env var the skill's launcher reads first (it execs this file and never downloads).
    env: IMPECCABLE_BIN
    # Env var of the launcher's cache dir: set to a dir inside the run's scratch dir (writable, per run).
    homeEnv: IMPECCABLE_HOME
    platforms:
      darwin-arm64:
        # Repo-relative path (gitignored `/pinned-bin/`).
        path: pinned-bin/impeccable/0.1.16/darwin-arm64/impeccable
        url: https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.16/impeccable-darwin-arm64
        sha256: 5c00c3130b961f3aa1066f04ed0e1f58e87808ad153efa00f1c44184800084f2
        bytes: 17192672
