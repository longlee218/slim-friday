# L2 effort-signal lexicon (never routes; only adjusts effort). Written WITH Vietnamese diacritics:
# phrases are normalized (accents stripped, lowercase) at load, so plain-ASCII input matches too.
# `phrases` fire alone; `weak` words are ambiguous and only fire in pairs (two distinct weak words).
# Override per group in <AGENT_HOME>/intent-lexicon.yaml: a group there REPLACES the default group.
groups:
  # The owner rejects the previous result: thread effort floor +1.
  reject_previous:
    effect: { floorDelta: 1 }
    phrases:
      - sai rồi
      - sai hoàn toàn
      - không đúng
      - chưa đúng
      - lạc đề
      - không liên quan
      - hiểu sai ý
      - hiểu nhầm
      - làm lại
      - trả lời lại
      - viết lại
      - không phải cái tôi cần
      - that is wrong
      - not what i asked
      - redo
      - try again
    weak: [sai, nhầm]
  # Quality complaint: floor +1.
  quality_complaint:
    effect: { floorDelta: 1 }
    phrases:
      - sơ sài
      - hời hợt
      - cẩu thả
      - qua loa
      - chung chung
      - thiếu căn cứ
      - chưa ổn
      - thất vọng
      - không dùng được
      - too vague
      - too shallow
      - sloppy
    weak: [bịa, ẩu]
  # Think carefully: this turn +1.
  think_carefully:
    effect: { turnDelta: 1 }
    phrases:
      - suy nghĩ kỹ
      - nghĩ kỹ
      - xem xét kỹ
      - tìm hiểu kỹ
      - cân nhắc
      - cẩn thận
      - kỹ lưỡng
      - thấu đáo
      - đừng vội
      - think carefully
      - think hard
      - be thorough
  # Analyze / judge: effort at least high.
  analyze_judge:
    effect: { minEffort: high }
    phrases:
      - phân tích
      - đánh giá
      - phản biện
      - thẩm định
      - so sánh
      - root cause
      - đánh đổi
      - trade-off
      - analyze
      - evaluate
      - critique
  # Design / synthesize: effort at least high, class hint design. "thiết kế" alone is ambiguous ("file thiết kế").
  design_synthesize:
    effect: { minEffort: high, classHint: design }
    phrases:
      - mô hình hóa
      - kiến trúc
      - lập kế hoạch
      - chiến lược
      - đề xuất giải pháp
      - tái cấu trúc
      - thiết kế lại
      - thiết kế giải pháp
      - thiết kế hệ thống
      - architecture
      - system design
      - refactor plan
    weak: [thiết kế, giải pháp, đề xuất]
  # Verify against sources: enable web lookup.
  verify:
    effect: { lookup: true }
    phrases:
      - xác minh
      - đối chiếu
      - dẫn nguồn
      - nguồn chính thức
      - tài liệu chính thức
      - mới nhất
      - official docs
      - verify
      - cite sources
      - latest version
  # Many constraints / edge cases: this turn +1.
  many_constraints:
    effect: { turnDelta: 1 }
    phrases:
      - đồng thời
      - với điều kiện
      - xét các trường hợp
      - ngoại lệ
      - rủi ro
      - edge case
      - edge cases
      - constraints
  # Wants it fast and short: this turn -1.
  want_fast:
    effect: { turnDelta: -1 }
    phrases:
      - nhanh thôi
      - ngắn gọn
      - tóm tắt
      - sơ qua
      - không cần chi tiết
      - quick answer
      - briefly
      - tl dr
