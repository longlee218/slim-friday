# Annotations of the built-in SDK tools. Read-only tools never ask; sandboxed tools are bounded by the OS sandbox.
tools:
  - { name: Read, annotations: { readOnlyHint: true } }
  - { name: Grep, annotations: { readOnlyHint: true } }
  - { name: Glob, annotations: { readOnlyHint: true } }
  - { name: Write, sandboxed: true }
  - { name: Edit, sandboxed: true }
  - { name: NotebookEdit, sandboxed: true }
  - { name: Bash, sandboxed: true }
  - { name: WebFetch, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: WebSearch, annotations: { readOnlyHint: true, openWorldHint: true } }
  # Starting a subagent or writing the todo list changes nothing; the subagent's own calls are decided one by one.
  - { name: Agent, annotations: { readOnlyHint: true } }
  - { name: TodoWrite, annotations: { readOnlyHint: true } }
  # Browser tools that only look; the rest (click, type, ...) ask.
  - { name: mcp__playwright__browser_navigate, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_snapshot, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_take_screenshot, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_tabs, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_wait_for, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_console_messages, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_network_requests, annotations: { readOnlyHint: true, openWorldHint: true } }
  # The bot's own memory: bounded by the memory tools' code, so saving needs no card.
  - { name: mcp__memory__MemorySearch, annotations: { readOnlyHint: true } }
  - { name: mcp__memory__MemorySave, sandboxed: true }
  - { name: mcp__memory__MemoryEdit, sandboxed: true }
  # Deleting moves to the trash (kept 7 days): destructive, so it asks, but not irreversible.
  - { name: mcp__effects__DeletePaths, annotations: { destructiveHint: true, idempotentHint: true, openWorldHint: false }, scopeKeys: [paths] }
