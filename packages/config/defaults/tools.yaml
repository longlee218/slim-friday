# Annotations of the built-in SDK tools. Read-only tools never ask; sandboxed tools are bounded by the OS sandbox.
tools:
  - { name: Read, annotations: { readOnlyHint: true } }
  - { name: Grep, annotations: { readOnlyHint: true } }
  - { name: Glob, annotations: { readOnlyHint: true } }
  - { name: Write, sandboxed: true }
  - { name: Edit, sandboxed: true }
  - { name: NotebookEdit, sandboxed: true }
  - { name: Bash, sandboxed: true }
  - { name: WebFetch, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: WebSearch, annotations: { readOnlyHint: true, openWorldHint: true } }
  # Starting a subagent or writing the todo list changes nothing; the subagent's own calls are decided one by one.
  - { name: Agent, annotations: { readOnlyHint: true } }
  - { name: TodoWrite, annotations: { readOnlyHint: true } }
  # Browser tools that only look; the rest (click, type, ...) ask.
  - { name: mcp__playwright__browser_navigate, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_snapshot, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_take_screenshot, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_tabs, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_wait_for, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_console_messages, annotations: { readOnlyHint: true, openWorldHint: true } }
  - { name: mcp__playwright__browser_network_requests, annotations: { readOnlyHint: true, openWorldHint: true } }
  # The bot's own memory: bounded by the memory tools' code, so saving needs no card.
  # A skill only loads instructions the owner put in the bot's own list: no card.
  - { name: Skill, annotations: { readOnlyHint: true } }
  - { name: TaskCreate, annotations: { readOnlyHint: true } }
  - { name: TaskGet, annotations: { readOnlyHint: true } }
  - { name: TaskUpdate, annotations: { readOnlyHint: true } }
  - { name: TaskList, annotations: { readOnlyHint: true } }
  - { name: TaskStop, annotations: { readOnlyHint: true } }
  - { name: mcp__memory__MemorySearch, annotations: { readOnlyHint: true } }
  - { name: mcp__memory__MessageSearch, annotations: { readOnlyHint: true } }
  - { name: mcp__memory__MemorySave, sandboxed: true }
  - { name: mcp__memory__MemoryEdit, sandboxed: true }
  # Sending a file to the chat: the tool checks the path itself (workspace or scratch dir only), so no card.
  - { name: mcp__chat__PostFile, sandboxed: true }
  # Changes only the thinking effort of the session, capped by the bot file's maxEffort: no side effect outside the run.
  - { name: mcp__chat__SetEffort, annotations: { readOnlyHint: true } }
  # A short progress note to the owner: the hub applies the budget (60 s old, 3 per run, 500 chars), so no card.
  - { name: mcp__chat__PostUpdate, annotations: { readOnlyHint: true } }
  # Messages between bots of one group: the hub checks the target, the hop and rate caps and the spend cap, so no card.
  - { name: mcp__chat__SendToBot, annotations: { readOnlyHint: true } }
  - { name: mcp__chat__HandOff, annotations: { readOnlyHint: true } }
  # The shared ticket board: the board rules check input, assignee and wakes, and the owner reads it with /tickets, so no card.
  - { name: mcp__tickets__TicketList, annotations: { readOnlyHint: true } }
  - { name: mcp__tickets__TicketGet, annotations: { readOnlyHint: true } }
  - { name: mcp__tickets__TicketCreate, annotations: { readOnlyHint: true } }
  - { name: mcp__tickets__TicketUpdate, annotations: { readOnlyHint: true } }
  - { name: mcp__tickets__TicketComment, annotations: { readOnlyHint: true } }
  # Deleting moves to the trash (kept 7 days): destructive, so it asks, but not irreversible.
  - { name: mcp__effects__DeletePaths, annotations: { destructiveHint: true, idempotentHint: true, openWorldHint: false }, scopeKeys: [paths] }
  - { name: mcp__effects__GitPush, annotations: { destructiveHint: false, openWorldHint: true }, scopeKeys: [workspace, remote, branch] }
  - { name: mcp__effects__CreatePullRequest, annotations: { destructiveHint: false, openWorldHint: true }, scopeKeys: [workspace, base] }
  - { name: mcp__effects__MergeBranch, annotations: { destructiveHint: true, idempotentHint: false, openWorldHint: false }, scopeKeys: [workspace, into] }
  - { name: mcp__effects__CreateProject, annotations: { destructiveHint: false, openWorldHint: false } }
  - { name: mcp__design__BotLookup, annotations: { readOnlyHint: true } }
  # Review data from the engine's own log (Friday only): reads, never writes.
  - { name: mcp__design__BotInsight, annotations: { readOnlyHint: true } }
  # Writes the owner's config (bots, skills, MCP servers that run code): asked at every level, never "Always allow".
  # scopeKeys put the risky fields on the approval card, in this order (the card is cut at a fixed length).
  - { name: mcp__design__BotDesign, annotations: { destructiveHint: true, idempotentHint: false, openWorldHint: true }, scopeKeys: [action, id, overwrite, autonomy, effort, maxEffort, server, tools, workspaces, skills, source, name, members, subagents, lesson] }
